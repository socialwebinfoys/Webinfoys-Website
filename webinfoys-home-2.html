<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moved — Webinfoys home</title>
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=index.html" />
  <link rel="canonical" href="https://webinfoys.com/" />
  <meta name="theme-color" content="#080A10" />
  <meta name="description"
    content="The Webinfoys homepage is now served from the site root. You are being redirected." />
  <style>
    :root {
      --bg: #080A10;
      --ink: #F2F1F7;
      --muted: #ABA9BD;
      --b1-text: #AFA3F8;
      --hair: rgba(236, 234, 243, 0.12);
      --accent: linear-gradient(120deg, #8B7BF2, #C77BE0 55%, #F49AC0);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.011em
    }

    .card {
      width: min(560px, 100%);
      padding: clamp(28px, 5vw, 44px);
      border-radius: 28px;
      text-align: center;
      background: linear-gradient(145deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .026) 45%, rgba(255, 255, 255, .011)), rgba(10, 13, 24, .82);
      border: 1px solid var(--hair);
      box-shadow: 0 1px 0 0 rgba(255, 255, 255, .28) inset, 0 24px 70px -26px rgba(0, 0, 0, .7)
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.03em
    }

    p {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15.5px;
      line-height: 1.7
    }

    a.go {
      display: inline-flex;
      margin-top: 26px;
      padding: 13px 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>This page has moved</h1>
    <p>The Webinfoys homepage is now served from the site root. You should be redirected automatically — if not, use
      the link below.</p>
    <a class="go" href="index.html">Go to the homepage</a>
  </main>
  <script>location.replace("index.html");</script>
</body>

</html>
